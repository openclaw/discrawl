name: publish-discord-backup

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      reconcile_cloud:
        description: Reconcile the configured private identity plan against Discord before publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-backup-repo
  cancel-in-progress: false

env:
  DISCRAWL_NO_AUTO_UPDATE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout discrawl
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        timeout-minutes: 5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native entry points
        timeout-minutes: 10
        run: |
          go build -o "$RUNNER_TEMP/discrawl-native" ./cmd/discrawl
          go build -o "$RUNNER_TEMP/discrawl-reconcile" scripts/reconcile_cloud_source.go

      - name: Configure runtime paths
        timeout-minutes: 1
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/discrawl"
          echo "CONFIG=$RUNNER_TEMP/discrawl/config.toml" >> "$GITHUB_ENV"
          echo "DB=$GITHUB_WORKSPACE/.discrawl-ci/discrawl.db" >> "$GITHUB_ENV"
          echo "BACKUP_REPO=$RUNNER_TEMP/discord-backup" >> "$GITHUB_ENV"
          echo "CHECKPOINT_RECEIPT=$RUNNER_TEMP/discrawl/checkpoint.json" >> "$GITHUB_ENV"

      - name: Restore verified private checkpoint
        timeout-minutes: 10
        id: restore
        env:
          DISCORD_BACKUP_TOKEN: ${{ secrets.DISCORD_BACKUP_TOKEN }}
          DISCRAWL_BACKUP_REPOSITORY: ${{ secrets.DISCRAWL_BACKUP_REPOSITORY }}
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$(dirname "$CONFIG")"
          python3 scripts/private_discord_checkpoint.py restore --prune --db "$DB" --receipt "$CHECKPOINT_RECEIPT"

      - name: Sync native Discord state
        timeout-minutes: ${{ inputs.reconcile_cloud && 7 || 22 }}
        id: sync
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCRAWL_GUILD_ID: ${{ secrets.DISCRAWL_GUILD_ID }}
          RECONCILE_CLOUD: ${{ inputs.reconcile_cloud && '1' || '0' }}
          MEMBER_REFRESH: ${{ github.event.schedule == '17 6 * * *' && '1' || '0' }}
        run: |
          umask 077
          test -n "$DISCORD_BOT_TOKEN" && test -n "$DISCRAWL_GUILD_ID"
          python3 scripts/private_discord_checkpoint.py run --timeout 60 -- \
            "$RUNNER_TEMP/discrawl-native" --config "$CONFIG" init --db "$DB" --guild "$DISCRAWL_GUILD_ID"
          sync_timeout=1200
          if [ "$RECONCILE_CLOUD" = "1" ]; then sync_timeout=300; fi
          sync_args=(--guild "$DISCRAWL_GUILD_ID" --skip-members --latest-only --no-update)
          if [ "$MEMBER_REFRESH" = "1" ]; then
            sync_args=(--guild "$DISCRAWL_GUILD_ID" --with-members --latest-only --no-update)
          fi
          python3 scripts/private_discord_checkpoint.py run --timeout "$sync_timeout" \
            --writer-receipt "$RUNNER_TEMP/discrawl/sync.json" -- \
            "$RUNNER_TEMP/discrawl-native" --config "$CONFIG" sync "${sync_args[@]}"

      - name: Reconcile requested native source
        timeout-minutes: 16
        id: reconcile
        if: ${{ steps.sync.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.reconcile_cloud }}
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCRAWL_GUILD_ID: ${{ secrets.DISCRAWL_GUILD_ID }}
          DISCRAWL_CLOUD_RECONCILE_PLAN: ${{ secrets.DISCRAWL_CLOUD_RECONCILE_PLAN }}
          DISCRAWL_CLOUD_ARCHIVE: ${{ secrets.DISCRAWL_CLOUD_ARCHIVE }}
        run: |
          python3 scripts/private_discord_checkpoint.py run --timeout 900 \
            --writer-receipt "$RUNNER_TEMP/discrawl/reconcile.json" -- "$RUNNER_TEMP/discrawl-reconcile"

      - name: Verify private ingestion checkpoint
        timeout-minutes: 15
        id: checkpoint
        if: ${{ always() && !cancelled() && steps.restore.outcome == 'success' && steps.sync.outcome != 'skipped' }}
        env:
          DISCORD_BACKUP_TOKEN: ${{ secrets.DISCORD_BACKUP_TOKEN }}
          DISCRAWL_BACKUP_REPOSITORY: ${{ secrets.DISCRAWL_BACKUP_REPOSITORY }}
          WRITER_RECEIPT: ${{ steps.reconcile.outcome != 'skipped' && 'reconcile.json' || 'sync.json' }}
        run: |
          python3 scripts/private_discord_checkpoint.py save --db "$DB" --receipt "$CHECKPOINT_RECEIPT" \
            --writer-receipt "$RUNNER_TEMP/discrawl/$WRITER_RECEIPT"

      - name: Require successful native ingestion
        timeout-minutes: 1
        if: ${{ always() && !cancelled() && (steps.sync.outcome != 'success' || steps.reconcile.outcome == 'failure') }}
        run: |
          echo "::error::Native ingestion did not complete. Publication was not requested; check the private checkpoint step for retained progress."
          exit 1

      - name: Publish Discord archive
        timeout-minutes: 10
        id: git-publish
        if: ${{ success() && steps.checkpoint.outcome == 'success' }}
        env:
          DISCORD_BACKUP_TOKEN: ${{ secrets.DISCORD_BACKUP_TOKEN }}
          DISCRAWL_BACKUP_REPOSITORY: ${{ secrets.DISCRAWL_BACKUP_REPOSITORY }}
        run: |
          umask 077
          GIT_CREDENTIALS="$RUNNER_TEMP/discord-backup-git-credentials"
          printf 'https://x-access-token:%s@github.com\n' "$DISCORD_BACKUP_TOKEN" > "$GIT_CREDENTIALS"
          git config --global credential.helper "store --file=$GIT_CREDENTIALS"
          git config --global user.name "discrawl publisher"
          git config --global user.email "discrawl-publisher@users.noreply.github.com"
          trap 'rm -f "$GIT_CREDENTIALS"' EXIT
          trap 'echo "::error::Private archive publication failed."; exit 1' ERR
          BACKUP_REMOTE="https://github.com/${DISCRAWL_BACKUP_REPOSITORY}.git"
          git clone --depth=1 --single-branch --branch main --no-tags -- "$BACKUP_REMOTE" "$BACKUP_REPO" >/dev/null 2>&1
          git -C "$BACKUP_REPO" config --add remote.origin.fetch '^refs/tags/*' >/dev/null 2>&1
          DISCRAWL_PRODUCER_REPOSITORY="$GITHUB_REPOSITORY" \
          DISCRAWL_PRODUCER_REVISION="$GITHUB_SHA" \
          DISCRAWL_PRODUCER_RUN_ID="$GITHUB_RUN_ID" \
          DISCRAWL_PRODUCER_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          "$RUNNER_TEMP/discrawl-native" --config "$CONFIG" publish \
            --repo "$BACKUP_REPO" --remote "$BACKUP_REMOTE" --readme "$BACKUP_REPO/README.md" \
            --message "sync: discord archive" --push >/dev/null 2>&1
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Archive publication completed."

      - name: Setup Node for cloud publication
        timeout-minutes: 3
        if: ${{ vars.DISCRAWL_CLOUD_PUBLISH_ENABLED == '1' && steps.git-publish.outputs.published == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Publish the same current state to D1 and R2
        if: ${{ vars.DISCRAWL_CLOUD_PUBLISH_ENABLED == '1' && steps.git-publish.outputs.published == 'true' }}
        timeout-minutes: 40
        env:
          DISCRAWL_CLOUD_ENDPOINT: ${{ secrets.DISCRAWL_CLOUD_ENDPOINT }}
          DISCRAWL_CLOUD_ARCHIVE: ${{ secrets.DISCRAWL_CLOUD_ARCHIVE }}
          DISCRAWL_CLOUD_AUTH_GITHUB_TOKEN: ${{ secrets.DISCORD_BACKUP_TOKEN }}
          DISCRAWL_CLOUD_ACCESS_CLIENT_ID: ${{ secrets.DISCRAWL_CLOUD_ACCESS_CLIENT_ID }}
          DISCRAWL_CLOUD_ACCESS_CLIENT_SECRET: ${{ secrets.DISCRAWL_CLOUD_ACCESS_CLIENT_SECRET }}
          DISCRAWL_CLOUD_SNAPSHOT: ${{ runner.temp }}/discrawl/cloud.db
          DISCRAWL_CLOUD_SOURCE_DB: ${{ github.workspace }}/.discrawl-ci/discrawl.db
        run: |
          umask 077
          trap 'rm -f "$DISCRAWL_CLOUD_SNAPSHOT"' EXIT
          trap 'echo "::error::Cloud publication failed after archive publication."; exit 1' ERR
          DISCRAWL_CLOUD_SOURCE_COMMIT="$(git -C "$BACKUP_REPO" rev-parse HEAD 2>/dev/null)"
          export DISCRAWL_CLOUD_SOURCE_COMMIT
          "$RUNNER_TEMP/discrawl-native" --config "$CONFIG" cloud publish --export-only "$DISCRAWL_CLOUD_SNAPSHOT" >/dev/null 2>&1
          node scripts/publish-cloud.mjs >/dev/null 2>&1
          echo "Cloud publication completed."
